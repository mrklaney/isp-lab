<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9771e"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a3fb0"/></marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="bold">Kim et al. (2000) delayed-choice quantum eraser: schematic</text>
  <text x="500" y="52" text-anchor="middle" font-size="13" fill="#555">Not to scale. Mirrors, prism and filters omitted. Blue = signal photon, orange = idler photon.</text>

  <!-- Pump laser -->
  <rect x="30" y="315" width="100" height="50" rx="6" fill="#efe6f7" stroke="#7a3fb0" stroke-width="2"/>
  <text x="80" y="337" text-anchor="middle" font-weight="bold">Pump</text>
  <text x="80" y="354" text-anchor="middle">laser</text>
  <line x1="130" y1="340" x2="185" y2="340" stroke="#7a3fb0" stroke-width="3" marker-end="url(#arrP)"/>

  <!-- Crystal with regions A and B -->
  <rect x="195" y="280" width="36" height="120" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="213" y="420" text-anchor="middle" font-size="12">crystal</text>
  <text x="213" y="435" text-anchor="middle" font-size="12">(BBO)</text>
  <circle cx="231" cy="310" r="6" fill="#333"/>
  <circle cx="231" cy="370" r="6" fill="#333"/>
  <text x="180" y="315" text-anchor="end" font-weight="bold" font-size="16">A</text>
  <text x="180" y="375" text-anchor="end" font-weight="bold" font-size="16">B</text>

  <!-- t0 / t1 badges -->
  <g>
    <circle cx="80" cy="292" r="14" fill="#7a3fb0"/>
    <text x="80" y="297" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t0</text>
    <circle cx="213" cy="258" r="14" fill="#333"/>
    <text x="213" y="263" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t1</text>
  </g>

  <!-- Signal arm -->
  <line x1="231" y1="310" x2="335" y2="188" stroke="#1f6fb2" stroke-width="2.5"/>
  <line x1="231" y1="370" x2="335" y2="212" stroke="#1f6fb2" stroke-width="2.5"/>
  <ellipse cx="338" cy="200" rx="7" ry="34" fill="#dcecf9" stroke="#1f6fb2" stroke-width="1.5"/>
  <text x="338" y="152" text-anchor="middle" font-size="12">lens</text>
  <line x1="341" y1="188" x2="438" y2="200" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#arrS)"/>
  <line x1="341" y1="212" x2="438" y2="200" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#arrS)"/>
  <text x="236" y="282" font-size="12" fill="#1f6fb2" transform="rotate(-50 236 282)">signal (short arm)</text>

  <!-- D0 -->
  <rect x="442" y="160" width="22" height="80" fill="#1f6fb2" stroke="#123f66" stroke-width="2"/>
  <line x1="480" y1="235" x2="480" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrK)"/>
  <line x1="480" y1="165" x2="480" y2="232" stroke="#333" stroke-width="1.5" marker-end="url(#arrK)"/>
  <text x="490" y="205" font-size="13">scans x</text>
  <text x="453" y="140" text-anchor="middle" font-weight="bold" font-size="16">D0</text>
  <text x="453" y="262" text-anchor="middle" font-size="12">screen pixel x</text>
  <circle cx="420" cy="140" r="14" fill="#1f6fb2"/>
  <text x="420" y="145" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t2</text>

  <!-- Idler arms to BS_A and BS_B -->
  <polyline points="231,310 400,420 548,420" fill="none" stroke="#d9771e" stroke-width="2.5"/>
  <polyline points="231,370 400,560 548,560" fill="none" stroke="#d9771e" stroke-width="2.5"/>
  <text x="300" y="470" font-size="13" fill="#d9771e" transform="rotate(48 300 470)">idler (long arm, ~2.5 m more)</text>
  <text x="470" y="412" text-anchor="middle" font-size="12" fill="#d9771e">path A</text>
  <text x="470" y="552" text-anchor="middle" font-size="12" fill="#d9771e">path B</text>

  <!-- BS_A, BS_B -->
  <line x1="540" y1="402" x2="576" y2="438" stroke="#333" stroke-width="4"/>
  <text x="560" y="392" text-anchor="middle" font-weight="bold">BS_A</text>
  <line x1="540" y1="578" x2="576" y2="542" stroke="#333" stroke-width="4"/>
  <text x="560" y="603" text-anchor="middle" font-weight="bold">BS_B</text>

  <!-- Transmitted to D3 / D4 -->
  <line x1="568" y1="420" x2="692" y2="420" stroke="#d9771e" stroke-width="2.5" marker-end="url(#arrI)"/>
  <line x1="568" y1="560" x2="692" y2="560" stroke="#d9771e" stroke-width="2.5" marker-end="url(#arrI)"/>
  <rect x="696" y="400" width="44" height="40" rx="4" fill="#c0392b"/>
  <text x="718" y="426" text-anchor="middle" fill="#fff" font-weight="bold">D3</text>
  <rect x="696" y="540" width="44" height="40" rx="4" fill="#c0392b"/>
  <text x="718" y="566" text-anchor="middle" fill="#fff" font-weight="bold">D4</text>
  <text x="750" y="416" font-size="12">transmitted:</text>
  <text x="750" y="431" font-size="12">"came from A"</text>
  <text x="750" y="584" font-size="12">transmitted:</text>
  <text x="750" y="599" font-size="12">"came from B"</text>

  <!-- Reflected to final BS -->
  <line x1="562" y1="424" x2="772" y2="487" stroke="#d9771e" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="562" y1="556" x2="772" y2="493" stroke="#d9771e" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="640" y="470" font-size="12" fill="#d9771e">reflected</text>
  <text x="640" y="521" font-size="12" fill="#d9771e">reflected</text>
  <line x1="760" y1="508" x2="790" y2="472" stroke="#333" stroke-width="4"/>
  <text x="742" y="510" text-anchor="end" font-weight="bold">BS</text>
  <text x="742" y="525" text-anchor="end" font-size="11">(50/50)</text>

  <!-- BS outputs to D1 / D2 -->
  <line x1="778" y1="488" x2="870" y2="458" stroke="#d9771e" stroke-width="2.5" marker-end="url(#arrI)"/>
  <line x1="778" y1="492" x2="870" y2="522" stroke="#d9771e" stroke-width="2.5" marker-end="url(#arrI)"/>
  <rect x="874" y="438" width="44" height="40" rx="4" fill="#27894a"/>
  <text x="896" y="464" text-anchor="middle" fill="#fff" font-weight="bold">D1</text>
  <rect x="874" y="502" width="44" height="40" rx="4" fill="#27894a"/>
  <text x="896" y="528" text-anchor="middle" fill="#fff" font-weight="bold">D2</text>
  <text x="896" y="566" text-anchor="middle" font-size="12">path erased</text>

  <circle cx="955" cy="490" r="14" fill="#d9771e"/>
  <text x="955" y="495" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t3</text>
  

  <circle cx="672" cy="390" r="12" fill="#d9771e"/><text x="672" y="394" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">t3</text>
  <circle cx="672" cy="590" r="12" fill="#d9771e"/><text x="672" y="594" text-anchor="middle" fill="#fff" font-weight="bold" font-size="11">t3</text>
  <!-- Coincidence counter -->
  <rect x="640" y="150" width="300" height="100" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
  <text x="790" y="175" text-anchor="middle" font-weight="bold">Coincidence counter</text>
  <text x="790" y="197" text-anchor="middle" font-size="12">pairs each D0 click (x) with the idler click (d)</text>
  <text x="790" y="217" text-anchor="middle" font-size="12">R0j = D0 events sorted by Dj</text>
  <text x="790" y="236" text-anchor="middle" font-size="12">R01, R02: fringes · R03, R04: no fringes</text>
  <line x1="466" y1="200" x2="638" y2="200" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="718" y1="398" x2="718" y2="252" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="896" y1="436" x2="896" y2="252" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Timeline -->
  <line x1="60" y1="680" x2="940" y2="680" stroke="#333" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="945" y="700" text-anchor="end" font-size="12" fill="#555">time</text>

  <circle cx="110" cy="680" r="14" fill="#7a3fb0"/>
  <text x="110" y="685" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t0</text>
  <text x="110" y="712" text-anchor="middle" font-size="12">pump hits crystal</text>
  <text x="110" y="727" text-anchor="middle" font-size="12">(source)</text>

  <circle cx="300" cy="680" r="14" fill="#333"/>
  <text x="300" y="685" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t1</text>
  <text x="300" y="712" text-anchor="middle" font-size="12">pair born in A or in B</text>
  <text x="300" y="727" text-anchor="middle" font-size="12">(path; idler now carries it)</text>

  <circle cx="500" cy="680" r="14" fill="#1f6fb2"/>
  <text x="500" y="685" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t2</text>
  <text x="500" y="712" text-anchor="middle" font-size="12">signal lands at D0, pixel x</text>
  <text x="500" y="727" text-anchor="middle" font-size="12">(early)</text>

  <path d="M530,665 Q620,640 710,665" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrK)"/>
  <text x="620" y="642" text-anchor="middle" font-size="12" fill="#555">≥ 8 ns later</text>

  <circle cx="740" cy="680" r="14" fill="#d9771e"/>
  <text x="740" y="685" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">t3</text>
  <text x="740" y="712" text-anchor="middle" font-size="12">idler meets BS_A/BS_B, BS;</text>
  <text x="740" y="727" text-anchor="middle" font-size="12">clicks D1, D2, D3 or D4 (late)</text>
</svg>
